<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to-do-list</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>To-do List</h1>
    <div class="container">
      <div class="add-task">
        <form id="task-form">
          <input type="text" id="task-input" placeholder="New task" required />
          <button type="submit">Add</button>
        </form>
      </div>

      <div class="tasks">
        <ul id="task-list">
          <li class="task-item">
            <span>Task Name</span>
            <div class="actions">
              <button class="btn-check" type="button"></button>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
